{% extends 'store/main.html' %} {% load static %} {% block content %}
<div class="container">

  <form method="get">
    <div class="form-group">
        <label for="search">Search</label>
        <input type="text" name="search" id="search" class="form-control" value="{{ request.GET.search }}">
    </div>
    <button type="submit" class="btn btn-primary">Search</button>

    <div class="form-group">
        <label for="category">Category</label>
        <select name="category" id="category" class="form-control">
            <option value="">All</option>
            {% for category in categories %}
                <option value="{{ category.id }}" {% if request.GET.category == category.id|stringformat:"s" %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
      <label for="price_range">Price Range</label>
      <div id="price-slider"></div>
      <div class="d-flex justify-content-between">
          <span id="min-price">{{ min_price_value }} PLN</span>
          <span id="max-price">{{ max_price_value }} PLN</span>
      </div>
      <input type="hidden" name="min_price" id="min_price" value="{{ request.GET.min_price|default:min_price_value }}">
      <input type="hidden" name="max_price" id="max_price" value="{{ request.GET.max_price|default:max_price_value }}">
    </div>
    <div class="form-group">
        <label for="place">Place</label>
        <input type="text" name="place" id="place" class="form-control" value="{{ request.GET.place }}">
    </div>
    <button type="submit" class="btn btn-primary">Filter</button>
    <a href="{% url 'store' %}" class="btn btn-secondary">Reset</a>
</form>

<div class="row">
  {% for product in products %}
  <div class="col-lg-4">
    <img class="thumbnail" src="{{product.imageURL}}" />
    <div class="box-element product">
      <h6><strong>{{product.name}}</strong></h6>
      <hr />

      <button data-product="{{product.id}}" data-action="add" class="btn btn-outline-secondary add-btn update-cart">Add to Cart</button>
      <a class="btn btn-outline-success" href="#">View</a>
      <h4 style="float: right"><strong>{{product.price}} PLN</strong></h4>
    </div>
  </div>
  {% endfor %}
</div>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.min.js"></script>
<script>
    var slider = document.getElementById('price-slider');
    noUiSlider.create(slider, {
        start: [
          JSON.parse('{{ request.GET.min_price|default:min_price_value }}'),
          JSON.parse('{{ request.GET.max_price|default:max_price_value }}')
        ],
        connect: true,
        range: {
            'min': JSON.parse('{{ min_price_value }}'),
            'max': JSON.parse('{{ max_price_value }}')
        },
        tooltips: [true, true],
        format: {
            to: function (value) {
                return Math.round(value);
            },
            from: function (value) {
                return Number(value);
            }
        }
    });

    slider.noUiSlider.on('update', function (values, handle) {
        document.getElementById('min_price').value = values[0];
        document.getElementById('max_price').value = values[1];
        document.getElementById('min-price').innerText = values[0] + ' PLN';
        document.getElementById('max-price').innerText = values[1] + ' PLN';
    });
</script>
{% endblock %}
